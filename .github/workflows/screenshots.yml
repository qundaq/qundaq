name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - run: test "${GITHUB_REF_NAME}" != "main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '26', cache: npm }
      - run: npm ci
      - run: npm run e2e:build-versions
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e:visual:update
      - name: Commit the baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          git diff --cached --quiet || git commit -m "test(e2e): refresh screenshot baselines"
          git push
